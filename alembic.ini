# Alembic configuration — AI Pharmacovigilance Intelligence Platform
# See https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file

[alembic]
# Path to migration scripts — relative to this ini file location (repo root)
script_location = backend/alembic
prepend_sys_path = .
# version_path_separator = os — use os-specific separator for version_locations
version_path_separator = os

# Placeholder URL — overridden at runtime by backend/alembic/env.py from
# DATABASE_URL env var / backend/.env via app.core.config.get_settings().
# The placeholder ensures `alembic` CLI can parse the ini even without env.
# For offline migrations, env.py uses context.config.get_main_option("sqlalchemy.url").
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

[post_write_hooks]
# No post-write hooks by default — keep empty for minimal baseline

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
